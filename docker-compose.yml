services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/evaluation:/app/evaluation
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-}
        VITE_API_SCOPE: ${VITE_API_SCOPE:-}
        VITE_API_BASE_URL: http://localhost:8000
        VITE_DISABLE_AUTH: ${DISABLE_AUTH:-true}
    ports:
      - "5173:80"
    depends_on:
      - backend
