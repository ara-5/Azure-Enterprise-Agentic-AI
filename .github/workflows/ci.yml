name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint-test:
    name: Backend lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest -v
        env:
          APP_ENV: local
          DISABLE_AUTH: "true"

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - name: Build (dummy env for CI verification only)
        run: npm run build
        env:
          VITE_ENTRA_CLIENT_ID: ci-placeholder
          VITE_ENTRA_TENANT_ID: ci-placeholder
          VITE_API_SCOPE: api://ci-placeholder/access_as_user
          VITE_API_BASE_URL: http://localhost:8000

  docker-build:
    name: Build Docker images (no push)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: eaap-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: eaap-frontend:ci
          build-args: |
            VITE_ENTRA_CLIENT_ID=ci-placeholder
            VITE_ENTRA_TENANT_ID=ci-placeholder
            VITE_API_SCOPE=api://ci-placeholder/access_as_user
            VITE_API_BASE_URL=http://localhost:8000

  infra-validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - name: Bicep build (lint/type-check)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
